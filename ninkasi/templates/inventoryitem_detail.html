{% extends 'base_detail.html' %}

{% load i18n ninkasi_tags %}

{% block content %}

<dl class="row">
  <dt class="col-sm-3">{% trans 'Stock' %}</dt>
  <dd class="col-sm-9">{{ object.amount }}{{ object.unit }}</dd>
  <dt class="col-sm-3">{% trans 'Batch nr' %}</dt>
  <dd class="col-sm-9">{{ object.batchnr }}</dd>
</dl>

<h2>Used in batches</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Batch</th>
    </tr>
  </thead>
  <tbody>
  {% for batch in object.list_batches %}
  <tr>
    <td><a href="{{ batch|detail_url }}">{{ batch }}</a></td>
  </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock content %}
