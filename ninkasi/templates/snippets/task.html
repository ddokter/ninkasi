{% load i18n ninkasi_tags %}

{% with details=task.get_details %}
<div class="alert
	    {% if task.is_done %}
	    alert-success
	    {% elif task.is_due %}
	    alert-danger
	    {% else %}
	    alert-info
	    {% endif %}
	    ">
  {% priority task %} <a href="{{ task|detail_url }}">{{ task }}</a>
  
  <div class="float-end">
    {{ task.get_deadline }}
    {% if task.is_due and not task.is_done %}
    <i class="fas fa-exclamation-triangle"></i>
    {% endif %}
  </div>
  <div class="clearfix"></div>
</div>
{% endwith %}
